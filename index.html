
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Steganography Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOGIN / SIGNUP OVERLAY -->
    <div id="auth-overlay">
        <div class="auth-box">
            <div id="login-form">
                <h2>Login</h2>
                <form id="login">
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
                <div class="toggle">
                    <a href="#" onclick="showForgotPassword()">Forgot Password?</a>
                </div>
                <div class="toggle">
                    Don't have an account? <a href="#" onclick="showSignup()">Sign up</a>
                </div>
            </div>

            <div id="signup-form" class="hidden">
                <h2>Sign Up</h2>
                <form id="signup">
                    <input type="text" placeholder="Full Name" required>
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <input type="password" placeholder="Confirm Password" required>
                    <button type="submit">Sign Up</button>
                </form>
                <div class="toggle">
                    Already have an account? <a href="#" onclick="showLogin()">Login</a>
                </div>
            </div>

            <div id="forgot-form" class="hidden">
                <h2>Forgot Password</h2>
                <form id="forgot">
                    <input type="email" placeholder="Enter your email" required>
                    <button type="submit">Send Reset Link</button>
                </form>
                <div class="toggle">
                    <a href="#" onclick="showLogin()">Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN TOOL -->
    <div id="tool-container">
        <h1>🖼 Image Steganography Tool</h1>

        <div class="steg-container">

            <!-- ENCODE SECTION -->
            <div class="section">
                <h2>🔒 Encode: Hide Text in Image</h2>
                <input type="file" id="imageInput" accept="image/*">
                <textarea id="messageInput" placeholder="Enter your secret message to hide..."></textarea>
                <button onclick="encode()">Encode & Download Hidden Image</button>
                <canvas id="originalCanvas" class="hidden"></canvas>
                <canvas id="encodedCanvas" class="hidden"></canvas>
            </div>

            <!-- DECODE SECTION -->
            <div class="section">
                <h2>🔍 Decode: Extract Text from Image</h2>
                <input type="file" id="encodedImageInput" accept="image/*">
                <button onclick="decode()">Decode & Reveal Message</button>
                <div id="output">Decoded message will appear here...</div>
                <canvas id="decodedCanvas" class="hidden"></canvas>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
